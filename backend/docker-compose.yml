services:
    backend:
        build:
            context: .
            target: production
        container_name: pizza-express-backend
        environment:
            DB_HOST: postgres
            DB_NAME: db_pizza_express_dev
            DB_PASSWORD: password
            DB_PORT: 5432
            DB_USER: postgres
            NODE_ENV: production
            PORT: 3000
            USE_DATABASE: "true"
            ELASTICSEARCH_URL: http://elasticsearch:9200
            ELASTICSEARCH_PRODUCTS_INDEX: pizza-products
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: pizza-express-postgres
        environment:
            POSTGRES_DB: db_pizza_express_dev
            POSTGRES_PASSWORD: password
            POSTGRES_USER: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d db_pizza_express_dev"]
            interval: 5s
            timeout: 5s
            retries: 20

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        container_name: pizza-express-elasticsearch
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 20

volumes:
    elasticsearch_data:
    postgres_data:
